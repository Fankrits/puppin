<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blind Box Shelf</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Mitr:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --red: #d63a2c;
        --ink: #111;
        --mint: #7fd1a8;
        --white: #fff;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1440px;
        height: 900px;
        overflow: hidden;
        background: #f2f2f2;
        font-family: Mitr, sans-serif;
        color: var(--ink);
      }
      header {
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 48px;
        background: var(--white);
        border-bottom: 3px solid var(--ink);
      }
      header b {
        font-size: 34px;
        color: var(--red);
      }
      header nav {
        display: flex;
        gap: 28px;
        font-size: 16px;
      }
      h1 {
        position: absolute;
        left: 48px;
        top: 120px;
        font-size: 96px;
        line-height: 0.95;
        font-weight: 700;
        width: 520px;
      }
      .series {
        position: absolute;
        left: 48px;
        top: 470px;
        width: 440px;
        background: var(--white);
        border: 3px solid var(--ink);
        border-radius: 16px;
        padding: 24px;
      }
      .series h3 {
        font-size: 24px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-top: 14px;
      }
      .grid span {
        aspect-ratio: 1;
        border-radius: 10px;
        background: #eee;
        border: 2px solid var(--ink);
      }
      .grid .secret {
        background: var(--ink);
      }
      .cta {
        margin-top: 18px;
        height: 60px;
        border-radius: 30px;
        background: var(--red);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 22px;
        font-weight: 700;
      }
      .shelf {
        position: absolute;
        left: 560px;
        right: 48px;
        top: 120px;
        bottom: 60px;
      }
      .board {
        position: absolute;
        left: 0;
        right: 0;
        height: 22px;
        background: #c9c9c9;
        border-radius: 4px;
      }
      .b1 {
        top: 360px;
      }
      .b2 {
        bottom: 0;
      }
      .box {
        position: absolute;
        width: 250px;
        height: 330px;
        background: var(--red);
        border: 3px solid var(--ink);
        border-radius: 12px;
        overflow: hidden;
      }
      .box .win {
        position: absolute;
        inset: 46px 26px 70px;
        background: rgba(255, 255, 255, 0.85);
        border-radius: 110px 110px 12px 12px;
        border: 3px solid var(--ink);
        overflow: hidden;
      }
      .box .win img {
        width: 120%;
        margin-left: -10%;
        margin-top: -4%;
      }
      .box .lbl {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 16px;
        text-align: center;
        color: #fff;
        font-size: 22px;
        font-weight: 700;
      }
      .box.small {
        width: 170px;
        height: 220px;
        background: var(--white);
      }
      .hero-box {
        left: 270px;
        top: 28px;
        width: 300px;
        height: 332px;
      }
      .s1 {
        left: 20px;
        top: 140px;
      }
      .s2 {
        left: 610px;
        top: 140px;
        background: var(--mint);
      }
      .s3 {
        left: 40px;
        top: 450px;
      }
      .s4 {
        left: 250px;
        top: 450px;
        background: var(--mint);
      }
      .s5 {
        left: 460px;
        top: 450px;
      }
      .s6 {
        left: 670px;
        top: 450px;
        background: var(--ink);
      }
    </style>
  </head>
  <body>
    <header>
      <b>Puppin</b>
      <nav><span>Series 01</span><span>เสื้อ</span><span>กางเกง</span><span>ตะกร้า</span></nav>
    </header>
    <h1>Series 01 ออกแล้ว</h1>
    <div class="series">
      <h3>Sprout Series · 8 pieces</h3>
      <div class="grid">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span
        ><span class="secret"></span>
      </div>
      <div class="cta">ใส่ตะกร้า · ฿890</div>
    </div>
    <div class="shelf">
      <div class="board b1"></div>
      <div class="board b2"></div>
      <div class="box small s1"></div>
      <div class="box small s2"></div>
      <div class="box hero-box">
        <div class="win"><img src="puppin-plush.png" alt="" /></div>
        <div class="lbl">PUPPIN · Sprout Tee</div>
      </div>
      <div class="box small s3"></div>
      <div class="box small s4"></div>
      <div class="box small s5"></div>
      <div class="box small s6"></div>
    </div>
  </body>
</html>
